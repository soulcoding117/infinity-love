        const mouse = new THREE.Vector2();
        window.addEventListener('click', (e) => {
            if (isAnimating) return;
            mouse.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);
            if (intersects.length) {
                let hit = intersects[0].object;
                while (hit && !clickableObjects.includes(hit) && hit.parent) hit = hit.parent;
                if (hit && hit.userData?.clickHandler) {
                    hit.userData.clickHandler();
                    // Optional fly-to
                    const objPos = hit.getWorldPosition(new THREE.Vector3());
                    let rad = 1.5;
                    if (hit.geometry && hit.geometry.boundingSphere) rad = hit.geometry.boundingSphere.radius;
                    const dist = Math.max(6.0, rad * 6.0);
                    const dir = camera.position.clone().sub(controls.target).normalize();
                    const newPos = objPos.clone().add(dir.multiplyScalar(dist));
                    gsap.to(camera.position, { x: newPos.x, y: newPos.y, z: newPos.z, duration: 0.8, ease: "power2.inOut", onUpdate: () => controls.update() });
                    gsap.to(controls.target, { x: objPos.x, y: objPos.y, z: objPos.z, duration: 0.8, ease: "power2.inOut", onUpdate: () => controls.update() });
                }
            }
        });
        
        // Audio hum (unchanged)
        let audioCtx = null;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.value = 42.0; gain.gain.value = 0.045;
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
            const lfo = audioCtx.createOscillator(); const lfoGain = audioCtx.createGain();
            lfo.frequency.value = 0.15; lfoGain.gain.value = 2.0;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency); lfo.start();
        }
        window.addEventListener('click', () => { if (!audioCtx) initAudio(); }, { once: true });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const t = performance.now() / 1000;
            scene.traverse(obj => {
                if (obj.material?.uniforms?.uTime) obj.material.uniforms.uTime.value = t;
                if (obj.userData?.rotSpeed) obj.rotation.y += obj.userData.rotSpeed;
                if (obj.userData?.isPulsar && obj.userData.light) {
                    obj.userData.light.intensity = 0.9 + 0.4 * Math.sin(t * (obj.userData.pulseSpeed || 6.0));
                }
            });
            bgStars.rotation.y += 0.00008;
            globalAsteroidField.rotation.y += 0.00015;
            dustField.rotation.x += 0.0001;
            ambientNebula.rotation.y += 0.00006;
            galaxies.forEach(gal => { gal.rotation.y += gal.userData.rotSpeed; if (gal.userData.belt) gal.userData.belt.rotation.y += 0.0002; });
            ton16Halo.rotation.y += 0.0003;
            controls.update();
            effectComposer.render();
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start the love popup with 30 seconds interval
        startLovePopup();
        console.log('✨ CHEESY LOVE UNIVERSE: 1000+ unique quotes, 30s popup interval, full 3D cosmos unchanged ✨');
    </script>
